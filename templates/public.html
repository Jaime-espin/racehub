<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RaceHub - Calendario Deportivo</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <header class="header-row">
            <div class="brand-section">
                <h1 class="brand-title" id="tituloPublico">RaceHub</h1>
                <div class="view-switch">
                    <button id="btnTabla" class="active" onclick="cambiarVista('tabla')">Tabla</button>
                    <button id="btnCalendario" onclick="cambiarVista('calendario')">Calendario</button>
                </div>
            </div>
            <div>
                <a href="/" class="btn btn-primary" style="text-decoration:none;">Crear mi propio calendario</a>
            </div>
        </header>

        <main id="lista-carreras">
            <div class="empty-state">Cargando carreras compartidas...</div>
        </main>
    </div>

    <script>
        const shareToken = "{{ share_token }}";
        const ownerName = "{{ owner_name }}";
        let carrerasCache = [];
        let vistaActual = 'tabla';

        document.addEventListener('DOMContentLoaded', () => {
            if (ownerName && ownerName !== 'None' && ownerName !== 'nulo') {
                document.getElementById('tituloPublico').textContent = `Calendario de ${ownerName}`;
                document.title = `RaceHub - Calendario de ${ownerName}`;
            }
            cargarCarreras();
        });

        function cambiarVista(vista) {
            vistaActual = vista;
            document.getElementById('btnTabla').classList.toggle('active', vista === 'tabla');
            document.getElementById('btnCalendario').classList.toggle('active', vista === 'calendario');
            renderizar();
        }

        async function cargarCarreras() {
            try {
                const res = await fetch(`/api/share/${shareToken}/carreras`);
                if (!res.ok) throw new Error('Calendario no disponible');
                carrerasCache = await res.json();
                renderizar();
            } catch (err) {
                document.getElementById('lista-carreras').innerHTML = '<div class="empty-state">No se pudo cargar el calendario compartido.</div>';
            }
        }

        function renderizar() {
            const container = document.getElementById('lista-carreras');
            if (!carrerasCache || carrerasCache.length === 0) {
                container.innerHTML = '<div class="empty-state">No hay carreras en este calendario.</div>';
                return;
            }

            carrerasCache.sort((a, b) => new Date(a.fecha) - new Date(b.fecha));
            const hoy = new Date();
            hoy.setHours(0, 0, 0, 0);

            if (vistaActual === 'tabla') {
                let rows = '';
                carrerasCache.forEach(c => {
                    const fecha = new Date(c.fecha);
                    const esPasada = fecha < hoy;
                    const res = c.resultados?.[0];
                    const estado = esPasada ? '<span class="badge badge-finalizada">Finalizada</span>' : `<span class="badge badge-${c.estado_inscripcion || 'pendiente'}">${c.estado_inscripcion || 'Pendiente'}</span>`;
                    
                    let resInfo = '';
                    if (res && res.tiempo_oficial) {
                        resInfo = `<div style="font-size:12px; color:var(--primary); margin-top:2px;">Tiempo: ${res.tiempo_oficial} (Pos. #${res.posicion_general || '--'})</div>`;
                    }

                    rows += `
                        <tr>
                            <td><strong>${c.fecha}</strong></td>
                            <td>
                                <div class="race-title">${c.nombre}</div>
                                <div class="race-subtitle">${c.distancia_resumen || ''}</div>
                                ${resInfo}
                            </td>
                            <td>${c.deporte}</td>
                            <td>${c.localizacion || '-'}</td>
                            <td>${estado}</td>
                        </tr>
                    `;
                });

                container.innerHTML = `
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Fecha</th>
                                    <th>Carrera</th>
                                    <th>Deporte</th>
                                    <th>Lugar</th>
                                    <th>Estado</th>
                                </tr>
                            </thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                `;
            } else {
                const agrupadas = {};
                carrerasCache.forEach(c => {
                    const d = new Date(c.fecha);
                    const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                    if (!agrupadas[key]) agrupadas[key] = [];
                    agrupadas[key].push(c);
                });

                let html = '<div class="calendar-view">';
                Object.keys(agrupadas).sort().forEach(key => {
                    const [ano, mes] = key.split('-');
                    const mesNombre = new Date(ano, mes - 1).toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
                    const titulo = mesNombre.charAt(0).toUpperCase() + mesNombre.slice(1);

                    html += `<div class="month-group"><h3>${titulo}</h3><div class="cards-grid">`;
                    agrupadas[key].forEach(c => {
                        const fecha = new Date(c.fecha);
                        const esPasada = fecha < hoy;
                        const dia = fecha.getDate();
                        const diaSemana = fecha.toLocaleDateString('es-ES', { weekday: 'short' });
                        const res = c.resultados?.[0];

                        let resInfo = '';
                        if (res && res.tiempo_oficial) {
                            resInfo = `<div style="font-size:12px; color:var(--primary); margin-top:4px;">Tiempo: ${res.tiempo_oficial} (Pos. #${res.posicion_general || '--'})</div>`;
                        }

                        html += `
                            <div class="calendar-card" style="${esPasada ? 'opacity:0.85; background:#fbfcfe;' : ''}">
                                <div class="calendar-date-badge">
                                    <div class="day">${dia}</div>
                                    <div class="weekday">${diaSemana}</div>
                                </div>
                                <div class="calendar-card-info">
                                    <div class="race-title">${c.nombre}</div>
                                    <div class="race-subtitle">${c.deporte}${c.distancia_resumen ? ' • ' + c.distancia_resumen : ''} • ${c.localizacion || '-'}</div>
                                    <div style="margin-top:6px;">
                                        <span class="badge badge-${esPasada ? 'finalizada' : (c.estado_inscripcion || 'pendiente')}">${esPasada ? 'Finalizada' : (c.estado_inscripcion || 'Pendiente')}</span>
                                    </div>
                                    ${resInfo}
                                </div>
                            </div>
                        `;
                    });
                    html += '</div></div>';
                });
                html += '</div>';
                container.innerHTML = html;
            }
        }
    </script>
</body>
</html>
